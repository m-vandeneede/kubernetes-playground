apiVersion: v1
kind: ConfigMap
metadata:
  name: tgtg-settings
  namespace: tgtg
data:
  CONTROL_DATA: /data
  CONTROL_RUNTIME: /run/scanner
  CONTROL_PORT: "8080"
  CONTROL_ALLOWED_HOSTS: tgtg.vandeneede.org,localhost,127.0.0.1
  CONTROL_SEED_CONFIG: /seed/config.ini
  CONTROL_ORIGIN: https://tgtg.vandeneede.org
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tgtg-seed
  namespace: tgtg
data:
  # Nonsecret defaults only. Account and notifier setup happen through the UI.
  config.ini: |
    [MAIN]
    SleepTime = 60
    Locale = en_US
    TimeFormat = 24h
    PriceMonitoring = false

    [TGTG]
    Username =

    [NTFY]
    Enabled = false
    Server = https://ntfy.sh
    Topic =
