apiVersion: apps/v1
kind: Deployment
metadata:
  name: tgtg-scanner
  namespace: tgtg
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: tgtg-scanner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tgtg-scanner
        app.kubernetes.io/part-of: tgtg-scanner
        app.kubernetes.io/component: control
    spec:
      automountServiceAccountToken: false
      serviceAccountName: tgtg-controller
      # vpn-proxy Service must exist before this pod is created.
      enableServiceLinks: true
      imagePullSecrets:
        - name: regcred
      nodeSelector:
        kubernetes.io/arch: amd64
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: control
          image: ghcr.io/m-vandeneede/tgtg-scanner@sha256:f34e26b98fb6b2b9e8518051bd7252201c4212191ff065e8376fc48491c444b5
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          envFrom:
            - configMapRef:
                name: tgtg-settings
          env:
            - name: VPN_PROXY_USERNAME
              valueFrom:
                secretKeyRef:
                  name: tgtg-proxy
                  key: username
            - name: VPN_PROXY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tgtg-proxy
                  key: password
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /health/live
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: api-credentials
              mountPath: /var/run/tgtg-api
              readOnly: true
            - name: data
              mountPath: /data
            - name: runtime
              mountPath: /run/scanner
            - name: tmp
              mountPath: /tmp
            - name: seed
              mountPath: /seed
              readOnly: true
      volumes:
        - name: api-credentials
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
        - name: data
          persistentVolumeClaim:
            claimName: tgtg-data
        - name: runtime
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: seed
          configMap:
            name: tgtg-seed
