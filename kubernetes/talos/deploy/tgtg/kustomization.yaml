apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - vpn-service.yaml
  - vpn-deployment.yaml
  - rbac.yaml
  - config.yaml
  - volumeclaim.yaml
  - app-deployment.yaml
  - app-service.yaml
  - app-ingress.yaml
patches:
  - target:
      kind: Namespace
      name: tgtg
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/sync-options: Prune=false,Delete=false
          argocd.argoproj.io/sync-wave: "-2"
  - target:
      kind: PersistentVolumeClaim
      name: tgtg-data
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/sync-options: Prune=false,Delete=false
  - target:
      kind: Service
      name: vpn-proxy
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/sync-wave: "-1"
