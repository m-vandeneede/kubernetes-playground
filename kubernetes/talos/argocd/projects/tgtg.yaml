apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: tgtg
  namespace: argocd
spec:
  description: LAN-only TGTG scanner and controller-owned on-demand VPN
  sourceRepos:
    - git@github.com:m-vandeneede/kubernetes-playground.git
  destinations:
    - name: KubeLAB
      namespace: tgtg
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: PersistentVolumeClaim
    - group: ""
      kind: Service
    - group: ""
      kind: ServiceAccount
    - group: apps
      kind: Deployment
    - group: networking.k8s.io
      kind: Ingress
    - group: rbac.authorization.k8s.io
      kind: Role
    - group: rbac.authorization.k8s.io
      kind: RoleBinding
