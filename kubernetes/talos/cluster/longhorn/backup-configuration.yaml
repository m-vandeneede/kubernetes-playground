# Recovered from the running installation; no credentials are required for NFS.
apiVersion: longhorn.io/v1beta2
kind: BackupTarget
metadata:
  name: default
  namespace: longhorn-system
spec:
  backupTargetURL: nfs://backupvault.storage.vandeneede.org:/volume1/LonghornBackup
  credentialSecret: ""
  pollInterval: 5m0s
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: daily-backup
  namespace: longhorn-system
spec:
  concurrency: 1
  cron: "0 4 * * *"
  groups:
    - default
  labels: {}
  name: daily-backup
  parameters: {}
  retain: 14
  task: backup
